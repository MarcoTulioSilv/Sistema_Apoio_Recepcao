# Alembic do SAR (DD-60). A URL não fica aqui: vem de SAR_URL_MIGRACAO (usuário sar_migracao),
# preenchida pela linha de comando `sar migrar` a partir dos segredos.
[alembic]
script_location = %(here)s/sar/modulo_08_dados/migracoes
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
