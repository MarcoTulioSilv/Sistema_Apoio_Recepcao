# Integração contínua do SAR (PT_recepcao §8): as 11 etapas, na ordem; a primeira falha interrompe.
name: Integração contínua

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  TAILWIND_VERSAO: v4.3.3
  GITLEAKS_VERSAO: 8.30.1
  VERAPDF_VERSAO: 1.30.3
  # Banco descartável do contêiner iniciado no job; a senha só existe durante ele.
  MYSQL_RAIZ: raiz-somente-ci
  SAR_SEGREDOS: ${{ github.workspace }}/segredos
  SAR_BANCO_HOST: 127.0.0.1
  SAR_BANCO_PORTA: "3306"
  SAR_BANCO_NOME: sar_teste  # o mesmo banco de testes do desenvolvimento
  MYSQL_HOST: 127.0.0.1
  MYSQL_TCP_PORT: "3306"
  SAR_EXIGIR_CLAMAV: "1"  # os testes do antimalware falham, em vez de pular, sem o clamd (CT-DOC-02)
  SAR_EXIGIR_FERRAMENTAS: "1"  # idem para o Tesseract (DD-40) e o veraPDF (CT-DOC-03)
  SAR_VERAPDF: /opt/verapdf/verapdf

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # Contêiner iniciado à mão, e não como `services`: o serviço do Actions não aceita as opções do servidor
      # que a DD-82 exige, e o verificar_esquema.sh confere.
      - name: Banco (mesma imagem da produção, AD-09)
        run: |
          docker run -d --name mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD="$MYSQL_RAIZ" mysql:9.7.2 \
            --disable-log-bin --general-log=0 --slow-query-log=0

      # Mesma imagem do compose.yaml; baixa as assinaturas enquanto as primeiras etapas rodam.
      - name: Antimalware (SEG-09)
        run: docker run -d --name clamav -p 127.0.0.1:3310:3310 clamav/clamav:1.5.4

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # o gitleaks varre o histórico inteiro

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Dependências
        run: python -m pip install -e ".[dev]"

      # Ferramentas externas do MOD-04: o Tesseract em português e o validador de PDF/A (Java já vem no runner).
      - name: Tesseract e veraPDF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-por
          curl -sSfL -o /tmp/verapdf.zip \
            "https://software.verapdf.org/releases/1.30/verapdf-greenfield-${VERAPDF_VERSAO}-installer.zip"
          unzip -q /tmp/verapdf.zip -d /tmp/verapdf
          sudo java -jar "/tmp/verapdf/verapdf-greenfield-${VERAPDF_VERSAO}/verapdf-izpack-installer-${VERAPDF_VERSAO}.jar" \
            .github/verapdf/auto-install.xml
          "$SAR_VERAPDF" --version

      - name: 1. Formatação e estilo
        run: |
          ruff check .
          ruff format --check .

      - name: 2. Tipos
        run: mypy sar agente_captura

      - name: 3. Fronteiras
        run: lint-imports

      - name: 4. Segredos e dependências
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git --no-banner --redact .
          pip-audit --skip-editable

      - name: 5. Análise estática
        run: bandit -q -c pyproject.toml -r sar agente_captura

      - name: 6. Unidade
        run: |
          until docker exec clamav clamdcheck.sh > /dev/null 2>&1; do sleep 5; done
          pytest testes -m "not integracao and not sistema" --cov --cov-report=

      - name: 7. Migração e esquema
        run: |
          until docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_RAIZ" --silent; do sleep 2; done
          mkdir -p segredos
          printf '%s' "$MYSQL_RAIZ" > segredos/mysql_root
          python scripts/criar_segredos_dev.py
          SEGREDOS="$SAR_SEGREDOS" bash docker/mysql/init/00_banco.sh
          sar migrar
          sar reverter base
          sar migrar
          sar criar-usuarios-banco
          ADMIN="-uroot -p$MYSQL_RAIZ" WEB_SENHA="$(cat segredos/sar_web)" WORKER_SENHA="$(cat segredos/sar_worker)" \
            EXPURGO_SENHA="$(cat segredos/sar_expurgo)" BANCO=sar_teste bash scripts/verificar_esquema.sh

      - name: 8. Integração
        run: pytest testes -m integracao --cov --cov-append --cov-report=

      - name: 9. Interface
        run: |
          curl -sSfL -o tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSAO}/tailwindcss-linux-x64"
          chmod +x tailwindcss
          ./tailwindcss -i sar/web/src/sar.css -o sar/web/static/css/sar.css --minify

      - name: 10. Sistema
        run: |
          playwright install --with-deps chromium
          pytest testes -m sistema --cov --cov-append --cov-report=

      - name: 11. Rastreabilidade e cobertura
        run: |
          mkdir -p relatorios
          # Até a homologação, falha só com requisito citado e inexistente; as lacunas vão no relatório.
          python scripts/verificar_rastreabilidade.py --estrito-citacoes | tee relatorios/rastreabilidade.txt
          coverage report --fail-under=80 | tee relatorios/cobertura.txt
          coverage xml -o relatorios/cobertura.xml

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios
          path: relatorios/
          if-no-files-found: ignore
